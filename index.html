<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🎭 Гра "Блеф"</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😈</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>🎭 Гра "Блеф"</h1>
      <p class="subtitle">Ласкаво просимо! Оберіть дію:</p>

      <button class="btn btn-primary" onclick="openCreateModal()">
        👑 Створити гру
      </button>

      <button class="btn btn-secondary" onclick="openSessionsModal()">
      🗂️ Переглянути сесії
      </button>

      <button class="btn btn-success" onclick="openJoinModal()">
        🎮 Доєднатися до гри
      </button>
    </div>

    <!-- 1. Модальне вікно: Створити гру (Адмін) -->
    <div id="createModal" class="modal-overlay">
      <div class="modal">
        <h3>Створення нової сесії</h3>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 5px">
          Введіть пароль для цієї гри:
        </p>

        <div class="password-container">
          <input
            type="password"
            id="adminPasswordInput"
            placeholder="Пароль кімнати"
            onkeydown="handleKeyPress(event, 'create')"
          />
          <button
            type="button"
            class="toggle-password"
            id="togglePasswordBtn"
            onclick="togglePasswordVisibility()"
          >
            👁️
          </button>
        </div>

        <div id="errorMsg" class="error-msg">Введіть пароль!</div>

        <div class="modal-buttons">
          <button class="modal-btn btn-cancel" onclick="closeModal('createModal')">
            Скасувати
          </button>
          <button class="modal-btn btn-primary" onclick="createGameSession()">
            Створити
          </button>
        </div>
      </div>
    </div>

    <!-- 2. Модальне вікно: Переглянути сесії -->
    <div id="sessionsModal" class="modal-overlay">
      <div class="modal" style="max-width: 420px;">
        <h3>Архів сесій гри</h3>
        <div id="sessionsList">Завантаження...</div>
        <div class="modal-buttons" style="margin-top: 15px;">
          <button class="modal-btn btn-cancel" onclick="closeModal('sessionsModal')">
            Закрити
          </button>
        </div>
      </div>
    </div>

    <!-- 3. Модальне вікно: Доєднатися до гри (Гравець) -->
    <div id="joinModal" class="modal-overlay">
      <div class="modal">
        <h3>Введіть код гри</h3>

        <div class="password-container">
          <input
            type="text"
            id="joinCodeInput"
            placeholder="4-значний код кімнати"
            maxlength="4"
            style="text-transform: uppercase"
            onkeydown="handleKeyPress(event, 'join')"
          />
        </div>

        <div id="joinErrorMsg" class="error-msg">Кімнату не знайдено!</div>

        <div class="modal-buttons">
          <button class="modal-btn btn-cancel" onclick="closeModal('joinModal')">
            Скасувати
          </button>
          <button class="modal-btn btn-success" onclick="verifyAndJoinGame()">
            Увійти
          </button>
        </div>
      </div>
    </div>

    <!-- 4. Модальне вікно: Введення пароля сесії з архіву -->
    <div id="sessionPasswordModal" class="modal-overlay">
      <div class="modal">
        <h3>Вхід до сесії</h3>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 5px">
          Введіть пароль для сесії <span id="targetSessionCode" style="color: #03dac6; font-weight: bold;"></span>:
        </p>

        <div class="password-container">
          <input
            type="password"
            id="sessionPasswordInput"
            placeholder="Пароль сесії"
            onkeydown="handleKeyPress(event, 'sessionLogin')"
          />
          <button
            type="button"
            class="toggle-password"
            id="toggleSessionPasswordBtn"
            onclick="toggleSessionPasswordVisibility()"
          >
            👁️
          </button>
        </div>

        <div id="sessionErrorMsg" class="error-msg">Неправильний пароль!</div>

        <div class="modal-buttons">
          <button class="modal-btn btn-cancel" onclick="closeModal('sessionPasswordModal')">
            Скасувати
          </button>
          <button class="modal-btn btn-primary" onclick="verifySessionPassword()">
            Увійти
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
